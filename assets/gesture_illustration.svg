<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Tap and swipe control illustration</title>
  <desc id="desc">A Wear OS watch face with left and right tap zones for scoring, plus swipe gestures for menu and undo.</desc>
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#eaf5ec"/>
    </linearGradient>
    <linearGradient id="watchBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d3e"/>
      <stop offset="1" stop-color="#1a1c1d"/>
    </linearGradient>
    <linearGradient id="screenG" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1e2d22"/>
      <stop offset="1" stop-color="#0a120c"/>
    </linearGradient>
    <linearGradient id="bandTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c2d"/>
      <stop offset="1" stop-color="#3e4142"/>
    </linearGradient>
    <linearGradient id="bandBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e4142"/>
      <stop offset="1" stop-color="#2a2c2d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowW" x="-25%" y="-15%" width="150%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#1a3320" flood-opacity="0.12"/>
    </filter>
    <clipPath id="screenClip"><circle cx="450" cy="250" r="118"/></clipPath>
  </defs>
  <rect width="900" height="500" rx="20" fill="url(#bgG)"/>

  <!-- Watch band top -->
  <rect x="418" y="60" width="64" height="60" rx="8" fill="url(#bandTop)"/>
  <!-- Watch band bottom -->
  <rect x="418" y="380" width="64" height="60" rx="8" fill="url(#bandBot)"/>
  <!-- Watch body -->
  <circle cx="450" cy="250" r="142" fill="url(#watchBody)" filter="url(#shadowW)"/>
  <circle cx="450" cy="250" r="136" fill="#2e3132" stroke="#555" stroke-width="1"/>
  <!-- Crown button -->
  <rect x="589" y="236" width="12" height="28" rx="4" fill="#4a4d4e"/>

  <!-- Screen -->
  <circle cx="450" cy="250" r="118" fill="url(#screenG)"/>

  <!-- Score display -->
  <g clip-path="url(#screenClip)">
    <text x="382" y="226" fill="#6fe882" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800">0</text>
    <text x="428" y="226" fill="rgba(255,255,255,0.5)" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="300">:</text>
    <text x="460" y="226" fill="#ff7b7b" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800">15</text>
    <!-- Tennis ball indicator -->
    <circle cx="450" cy="280" r="14" fill="#c8e600" opacity="0.9"/>
    <path d="M440 270 Q450 280 440 290" fill="none" stroke="#a0b800" stroke-width="1.5"/>
    <path d="M460 270 Q450 280 460 290" fill="none" stroke="#a0b800" stroke-width="1.5"/>
    <!-- Set/Game bar -->
    <rect x="380" y="310" width="140" height="28" rx="14" fill="rgba(255,255,255,0.08)"/>
    <text x="404" y="329" fill="rgba(255,255,255,0.7)" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">SET 0</text>
    <text x="472" y="329" fill="rgba(255,255,255,0.7)" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">GM 0</text>
    <!-- You / Opp labels -->
    <text x="398" y="178" fill="rgba(255,255,255,0.35)" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2">YOU</text>
    <text x="472" y="178" fill="rgba(255,255,255,0.35)" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2">OPP</text>
  </g>

  <!-- Tap zones (subtle arcs) -->
  <path d="M335 174 A118 118 0 0 0 335 326" fill="none" stroke="#2e9e4e" stroke-width="3" stroke-dasharray="6 4" opacity="0.5"/>
  <path d="M565 174 A118 118 0 0 1 565 326" fill="none" stroke="#e05555" stroke-width="3" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- Left tap indicator -->
  <g opacity="0.9">
    <circle cx="220" cy="250" r="36" fill="none" stroke="#2e9e4e" stroke-width="2"/>
    <circle cx="220" cy="250" r="28" fill="#2e9e4e" opacity="0.08"/>
    <text x="220" y="247" text-anchor="middle" fill="#2e9e4e" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">TAP</text>
    <text x="220" y="264" text-anchor="middle" fill="#2e9e4e" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" opacity="0.7">YOU +1</text>
    <!-- Connecting line -->
    <path d="M256 250 H332" fill="none" stroke="#2e9e4e" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>
  </g>

  <!-- Right tap indicator -->
  <g opacity="0.9">
    <circle cx="680" cy="250" r="36" fill="none" stroke="#e05555" stroke-width="2"/>
    <circle cx="680" cy="250" r="28" fill="#e05555" opacity="0.08"/>
    <text x="680" y="247" text-anchor="middle" fill="#e05555" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">TAP</text>
    <text x="680" y="264" text-anchor="middle" fill="#e05555" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" opacity="0.7">OPP +1</text>
    <path d="M644 250 H568" fill="none" stroke="#e05555" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>
  </g>

  <!-- Down swipe (menu) -->
  <g opacity="0.85">
    <path d="M450 70 L450 128" fill="none" stroke="#b8880e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M442 118 L450 130 L458 118" fill="none" stroke="#b8880e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="412" y="42" width="76" height="22" rx="11" fill="#b8880e" opacity="0.1"/>
    <text x="450" y="57" text-anchor="middle" fill="#b8880e" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">MENU</text>
  </g>

  <!-- Up swipe (undo) -->
  <g opacity="0.85">
    <path d="M450 430 L450 372" fill="none" stroke="#3b8bd9" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M442 382 L450 370 L458 382" fill="none" stroke="#3b8bd9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="412" y="436" width="76" height="22" rx="11" fill="#3b8bd9" opacity="0.1"/>
    <text x="450" y="451" text-anchor="middle" fill="#3b8bd9" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">UNDO</text>
  </g>
</svg>
