<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Tap and swipe control illustration</title>
  <desc id="desc">A Wear OS watch face with left and right tap zones for scoring, plus swipe gestures for menu and undo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141916"/>
      <stop offset="1" stop-color="#050706"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242827"/>
      <stop offset="1" stop-color="#050606"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowYellow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#e3ff00"/>
    </marker>
  </defs>
  <rect width="900" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="450" cy="282" r="164" fill="#090a09" stroke="#303632" stroke-width="18" filter="url(#shadow)"/>
  <circle cx="450" cy="282" r="136" fill="url(#screen)" stroke="#111" stroke-width="4"/>
  <text x="392" y="235" fill="#4eff62" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="900">0</text>
  <text x="444" y="236" fill="#f6f7f1" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="900">-</text>
  <text x="488" y="235" fill="#ff454e" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="900">15</text>
  <circle cx="450" cy="305" r="52" fill="#e3ff00"/>
  <path d="M418 265 C438 291 438 323 418 345" fill="none" stroke="#f6f7f1" stroke-width="8" stroke-linecap="round"/>
  <path d="M482 265 C462 291 462 323 482 345" fill="none" stroke="#f6f7f1" stroke-width="8" stroke-linecap="round"/>
  <rect x="382" y="382" width="136" height="40" rx="6" fill="#1c201d"/>
  <text x="402" y="409" fill="#f6f7f1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">SET</text>
  <text x="468" y="409" fill="#f6f7f1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">GAME</text>
  <path d="M318 174 A136 136 0 0 0 318 390" fill="none" stroke="#4eff62" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <path d="M582 174 A136 136 0 0 1 582 390" fill="none" stroke="#ff454e" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <circle cx="235" cy="282" r="44" fill="#4eff62" opacity="0.16" stroke="#4eff62" stroke-width="5"/>
  <circle cx="665" cy="282" r="44" fill="#ff454e" opacity="0.16" stroke="#ff454e" stroke-width="5"/>
  <text x="213" y="293" fill="#4eff62" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="900">TAP</text>
  <text x="643" y="293" fill="#ff454e" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="900">TAP</text>
  <path d="M450 92 V178" fill="none" stroke="#e3ff00" stroke-width="16" stroke-linecap="round" marker-end="url(#arrowYellow)"/>
  <path d="M450 468 V386" fill="none" stroke="#7ec8ff" stroke-width="16" stroke-linecap="round"/>
  <path d="M450 386 L426 410 M450 386 L474 410" fill="none" stroke="#7ec8ff" stroke-width="14" stroke-linecap="round"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="800">
    <text x="112" y="246" fill="#4eff62" font-size="25">LEFT: YOU +1</text>
    <text x="626" y="246" fill="#ff454e" font-size="25">RIGHT: OPP +1</text>
    <text x="408" y="70" fill="#e3ff00" font-size="25">MENU</text>
    <text x="408" y="516" fill="#7ec8ff" font-size="25">UNDO</text>
  </g>
</svg>
