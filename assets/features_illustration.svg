<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">TennisScore feature illustration</title>
  <desc id="desc">A visual flow from scoring to point reason, summary, presets, and match history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101512"/>
      <stop offset="1" stop-color="#050706"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202521"/>
      <stop offset="1" stop-color="#111412"/>
    </linearGradient>
    <marker id="flow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#4eff62"/>
    </marker>
  </defs>
  <rect width="900" height="560" rx="28" fill="url(#bg)"/>
  <g fill="none" stroke="#4eff62" stroke-width="8" stroke-linecap="round" marker-end="url(#flow)" opacity="0.9">
    <path d="M256 164 H366"/>
    <path d="M536 164 H646"/>
    <path d="M450 244 V318"/>
    <path d="M256 396 H366"/>
    <path d="M536 396 H646"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="74" y="96" width="182" height="136" rx="8" fill="url(#card)" stroke="#303832"/>
    <text x="104" y="140" fill="#4eff62" font-size="24" font-weight="900">SCORE</text>
    <text x="104" y="181" fill="#f6f7f1" font-size="44" font-weight="900">0-15</text>
    <circle cx="208" cy="175" r="22" fill="#e3ff00"/>
    <rect x="366" y="96" width="168" height="136" rx="8" fill="url(#card)" stroke="#303832"/>
    <text x="396" y="140" fill="#e3ff00" font-size="24" font-weight="900">REASON</text>
    <text x="396" y="178" fill="#f6f7f1" font-size="20" font-weight="800">Ace</text>
    <text x="396" y="206" fill="#b9beb8" font-size="18">Volley</text>
    <rect x="646" y="96" width="180" height="136" rx="8" fill="url(#card)" stroke="#303832"/>
    <text x="676" y="140" fill="#7ec8ff" font-size="24" font-weight="900">SUMMARY</text>
    <rect x="676" y="158" width="112" height="12" rx="6" fill="#4eff62"/>
    <rect x="676" y="184" width="82" height="12" rx="6" fill="#ff454e"/>
    <rect x="74" y="328" width="182" height="136" rx="8" fill="url(#card)" stroke="#303832"/>
    <text x="104" y="372" fill="#4eff62" font-size="24" font-weight="900">PRESETS</text>
    <text x="104" y="409" fill="#f6f7f1" font-size="20" font-weight="800">6 games</text>
    <text x="104" y="437" fill="#b9beb8" font-size="18">TieBreak ON</text>
    <rect x="366" y="328" width="168" height="136" rx="8" fill="url(#card)" stroke="#303832"/>
    <text x="396" y="372" fill="#e3ff00" font-size="24" font-weight="900">RULES</text>
    <text x="396" y="409" fill="#f6f7f1" font-size="20" font-weight="800">Deuce</text>
    <text x="396" y="437" fill="#b9beb8" font-size="18">Win by 2</text>
    <rect x="646" y="328" width="180" height="136" rx="8" fill="url(#card)" stroke="#303832"/>
    <text x="676" y="372" fill="#ff454e" font-size="24" font-weight="900">HISTORY</text>
    <text x="676" y="409" fill="#f6f7f1" font-size="20" font-weight="800">2026-05-31</text>
    <text x="676" y="437" fill="#b9beb8" font-size="18">Winner: YOU</text>
  </g>
</svg>
